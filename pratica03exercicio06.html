<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juros Compostos</title>
    <link rel="stylesheet" href="pratica03exercicio06.css">
</head>
<body>
    <main class="container">
        <h1>Juros Compostos</h1>

        <label for="capital">Capital inicial (R$):</label>
        <input type="number" id="capital" min="0" step="0.01" placeholder="Ex.: 1000">

        <label for="taxa">Taxa de juros (%):</label>
        <input type="number" id="taxa" step="any" placeholder="Ex.: 2">

        <label for="tempo">Prazo:</label>
        <input type="number" id="tempo" min="0" step="any" placeholder="Ex.: 12">

        <button id="calcular">Calcular montante</button>
        <p id="resultado" class="resultado" aria-live="polite"></p>
    </main>

    <script src="pratica03exercicio06.js"></script>
</body>
</html>
